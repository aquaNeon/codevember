<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shatter · Codevember 002</title>
    <meta
      name="description"
      content="A pane of glass you break, then scrub through time. Codevember day 2."
    />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#ebe5da" />
    <style>
      :root {
        --accent: #2f6a5e;
      }
      .cv-figure canvas {
        touch-action: none;
      }
      .cv-figure canvas:focus-visible {
        outline: 1px solid var(--ink);
        outline-offset: -8px;
      }
      .fig {
        position: fixed;
        top: 64px;
        right: var(--gutter);
        color: var(--muted);
        text-align: right;
      }
      .cv-btn:disabled {
        opacity: 0.35;
        pointer-events: none;
      }
      .still,
      .live-only {
        visibility: hidden;
      }
      [data-cv-live] .live-only {
        visibility: visible;
      }
      [data-cv-still] .cv-figure canvas {
        display: none;
      }
      [data-cv-still] .still {
        visibility: visible;
        position: absolute;
        left: 50%;
        top: 44%;
        width: min(52vw, 420px);
        aspect-ratio: 1.55;
        translate: -50% -50%;
        border: 2px solid rgb(47 106 94 / 0.55);
        background: linear-gradient(
          115deg,
          rgb(255 255 255 / 0.05) 30%,
          rgb(255 255 255 / 0.5) 42%,
          rgb(255 255 255 / 0.05) 50%
        );
        box-shadow: 0 60px 40px -50px rgb(28 42 38 / 0.25);
      }
      @media (max-width: 640px) {
        .fig {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="cv-top mono">
      <a href="../">Codevember ’26</a>
      <span>Day 002 of 030</span>
      <nav data-cv-nav aria-label="Days"></nav>
    </header>

    <main data-cv>
      <div class="cv-figure">
        <canvas
          data-cv-canvas
          tabindex="0"
          aria-label="A pane of glass in front of a printed card, a slingshot below. Drag back and let go to shoot it, then drag sideways to scrub the burst through time. Enter shoots or plays, arrow keys step time."
        ></canvas>
        <div class="still" role="img" aria-label="A pane of glass"></div>
      </div>

      <p class="fig mono">Fig. 2<br />Float glass, 6 mm</p>

      <section class="cv-title">
        <span class="mono">No. 002</span>
        <h1>Shatter<em>.</em></h1>
        <p>
          <em>Break it, then hold the moment.</em> Pull the sling and let go. Drag sideways to scrub
          the burst back and forth, stop it mid-air.
        </p>
      </section>

      <aside class="cv-hud mono live-only">
        <dl>
          <dt>Time</dt>
          <dd data-cv-time>0.00 s</dd>
          <dt>Pieces</dt>
          <dd data-cv-count>1</dd>
        </dl>
        <span data-cv-hint aria-live="polite">Pull the sling back, let go</span>
        <button type="button" class="cv-btn" data-cv-rewind disabled>Rewind</button>
      </aside>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
