<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codevember 2026</title>
    <meta
      name="description"
      content="Thirty small interactive sketches, one a day through November 2026."
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#ebe5da" />
    <style>
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 96px var(--gutter) 64px;
      }
      .mast {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: end;
        gap: 24px;
        padding-bottom: 28px;
        border-bottom: 1px solid var(--ink);
      }
      .mast h1 {
        margin: 0;
        font: 400 clamp(64px, 13vw, 168px) / 0.84 var(--serif);
        letter-spacing: -0.035em;
      }
      .mast p {
        margin: 0;
        max-width: 22ch;
        font-size: 18px;
        text-align: right;
      }
      ol {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      /* ROWS */
      .row {
        --ease: cubic-bezier(0.2, 0.7, 0.1, 1);
        position: relative;
        display: grid;
        grid-template-columns: 5ch 1fr auto;
        align-items: baseline;
        gap: 16px;
        padding: 14px 0;
        border-bottom: 1px solid var(--rule);
        text-decoration: none;
      }
      .row strong {
        display: inline-flex;
        align-items: center;
        font: 400 clamp(28px, 4vw, 44px) / 1 var(--serif);
        letter-spacing: -0.02em;
      }
      .row .num,
      .row .tag {
        transition:
          color 0.4s var(--ease),
          transform 0.5s var(--ease);
      }
      .row .rule {
        width: 0;
        height: 1px;
        margin-right: 0;
        background: currentColor;
        transition:
          width 0.55s var(--ease),
          margin 0.55s var(--ease);
      }
      /* hairline that wipes along the bottom of the active row */
      .row::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 1px;
        background: var(--ink);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.7s var(--ease);
      }
      a.row:hover::after,
      a.row:focus-visible::after {
        transform: scaleX(1);
      }
      a.row:hover .rule,
      a.row:focus-visible .rule {
        width: clamp(24px, 4vw, 48px);
        margin-right: 16px;
      }
      a.row:hover .num,
      a.row:focus-visible .num {
        color: var(--accent);
      }
      a.row:hover .tag,
      a.row:focus-visible .tag {
        transform: translateX(6px);
      }
      a.row:focus-visible {
        outline: 1px solid var(--ink);
        outline-offset: 6px;
      }
      .soon {
        color: var(--muted);
        opacity: 0.55;
      }

      /* PEEK */
      /* still of the day that trails the cursor, mouse only */
      .peek {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 20;
        width: 280px;
        margin: 0;
        pointer-events: none;
        opacity: 0;
        transform: translate3d(var(--x, 0), var(--y, 0), 0) scale(0.94);
        transition:
          opacity 0.25s ease,
          transform 0.35s cubic-bezier(0.2, 0.7, 0.1, 1);
        box-shadow: 0 18px 40px -18px rgb(40 28 16 / 0.35);
      }
      .peek[data-cv-on] {
        opacity: 1;
        transform: translate3d(var(--x, 0), var(--y, 0), 0) scale(1);
      }
      .peek img {
        display: block;
        width: 100%;
        height: auto;
      }
      @media (hover: none), (pointer: coarse) {
        .peek {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .row *,
        .row::after,
        .peek {
          transition-duration: 0.01s !important;
        }
      }
      @media (max-width: 640px) {
        .mast {
          grid-template-columns: 1fr;
        }
        .mast p {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <header class="cv-top mono">
      <span>Codevember ’26</span>
      <span>Index</span>
      <span></span>
    </header>
    <main>
      <div class="mast">
        <h1>Codevember</h1>
        <p><em>Thirty small sketches,</em> one a day through November.</p>
      </div>
      <ol data-cv-days></ol>
      <figure class="peek" data-cv-peek aria-hidden="true">
        <img alt="" width="280" height="187" decoding="async" />
      </figure>
    </main>
    <script type="module" src="./shared/gallery.ts"></script>
  </body>
</html>
