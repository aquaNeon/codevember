<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codevember 2026</title>
    <meta
      name="description"
      content="Thirty small interactive sketches, one a day through November 2026."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#ebe5da" />
    <style>
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 96px var(--gutter) 64px;
      }
      .mast {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: end;
        gap: 24px;
        padding-bottom: 28px;
        border-bottom: 1px solid var(--ink);
      }
      .mast h1 {
        margin: 0;
        font: 400 clamp(64px, 13vw, 168px) / 0.84 var(--serif);
        letter-spacing: -0.035em;
      }
      .mast p {
        margin: 0;
        max-width: 22ch;
        font-size: 18px;
        text-align: right;
      }
      ol {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li a,
      li span {
        display: grid;
        grid-template-columns: 5ch 1fr auto;
        align-items: baseline;
        gap: 16px;
        padding: 14px 0;
        border-bottom: 1px solid var(--rule);
        text-decoration: none;
      }
      li strong {
        font: 400 clamp(28px, 4vw, 44px) / 1 var(--serif);
        letter-spacing: -0.02em;
      }
      li a:hover strong,
      li a:focus-visible strong {
        font-style: italic;
      }
      li span {
        color: var(--muted);
        opacity: 0.55;
      }
      @media (max-width: 640px) {
        .mast {
          grid-template-columns: 1fr;
        }
        .mast p {
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <header class="cv-top mono">
      <span>Codevember ’26</span>
      <span>Index</span>
      <span></span>
    </header>
    <main>
      <div class="mast">
        <h1>Codevember</h1>
        <p><em>Thirty small sketches,</em> one a day through November.</p>
      </div>
      <ol data-cv-days></ol>
    </main>
    <script type="module" src="./shared/gallery.ts"></script>
  </body>
</html>
